name: Automated Pull Request

on:
  push:
    branches-ignore:
      - "classic"
  workflow_dispatch:

jobs:
  create_pr:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pusher.name != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or Query PR
        id: create-pr
        uses: offensive-vk/auto-pr-action@v8
        with:
          repo-token: ${{ secrets.BOT_TOKEN }}
          destination-branch: "classic"
          title: "Hamster Left A Pull Request - (${{ github.event.head_commit.message }})"
          body: "Hamster is working here. Sit tight!"
          reviewers: "offensive-vk"
          labels: "bot,hamster,pull-request"
          assignees: "TheHamsterBot"
          draft: false
        continue-on-error: true

      - name: Save PR Number in ENV
        run: echo "PR_NUMBER=${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_ENV

  update_pr:
    needs: create_pr
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pusher.name != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pull Request Template
        run: |
          timestamp=$(date '+%b %d, %A %I:%M:%S %p')
          markdown=$(cat <<EOF
          ## This Pull Request Was Automated by [Hamster [bot]](https://github.com/TheHamsterBot)

          > [!NOTE]
          > Workflow Trigger: ${{ github.event_name }} event at ${{ github.ref_name }} ${{ github.ref_type }}.
          > Details of Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - Author: @TheHamsterBot
          - Branch: ${{ github.ref_name }}
          - Commit: ${{ github.sha }}
          - Workflow Path: ${{ github.event.workflow }}
          - Pusher Details: ${{ github.event.head_commit.author.name }} - ${{ github.event.head_commit.author.email }} 

          ---

          Thanks.
          $timestamp
          Your Hamster 🐹 <code>PR90XPOMFW68FM</code>
          EOF)
          echo "$markdown" > .github/Auto_Pull_Request.md
          echo "MARKDOWN_CONTENT<<EOF" >> $GITHUB_ENV
          echo "$markdown" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update Pull Request Body
        run: |
          echo "$PR_NUMBER"
          gh pr edit "$PR_NUMBER" --body "$MARKDOWN_CONTENT"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
