name: Mirror Sync

on:
  push: 
    branches: ["**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Sync
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Action 
      uses: offensive-vk/auto-repo-sync@v7
      with:
        target-url: ${{ secrets.TARGET_URL }}
        target-username: ${{ secrets.TARGET_USERNAME }}
        target-token: ${{ secrets.TARGET_TOKEN }}
